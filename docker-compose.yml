# Dependencies only — the app itself runs on the host with `npm run dev`.
#
#   docker compose up -d          # start Keycloak (http://localhost:8080, admin/admin)
#   OIDC_ISSUER=http://localhost:8080/realms/feature-planner npm run dev
#
# The feature-planner realm (feature-planner client; the roles feature-planner-admin,
# feature-planner-viewer and one feature-planner-editor:<team-id> per demo team; test users
# admin/admin, editor/editor — editor of the Demo team only — and viewer/viewer) is
# imported on first start from the inline config below — no bind mounts, so it works
# regardless of Docker file-sharing settings. Changed the realm? `docker compose down -v`
# first: the import only runs into an empty Keycloak.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    ports:
      - '8080:8080'
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    configs:
      - source: keycloak-realm
        target: /opt/keycloak/data/import/feature-planner-realm.json
    healthcheck:
      # curl/wget absent in the image; TCP probe via bash
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 && exec 3>&-']
      interval: 5s
      timeout: 3s
      retries: 30

configs:
  keycloak-realm:
    content: |
      {
        "realm": "feature-planner",
        "enabled": true,
        "roles": {
          "realm": [
            { "name": "feature-planner-admin", "description": "Everything: every team, the Program, team management" },
            { "name": "feature-planner-viewer", "description": "Read-only access to every team" },
            { "name": "feature-planner-editor:demo", "description": "Edit the Demo team's plan" },
            { "name": "feature-planner-editor:mobile-apps", "description": "Edit the Mobile apps team's plan" },
            { "name": "feature-planner-editor:data-platform", "description": "Edit the Data platform team's plan" }
          ]
        },
        "clients": [
          {
            "clientId": "feature-planner",
            "name": "Feature Planner",
            "enabled": true,
            "publicClient": true,
            "standardFlowEnabled": true,
            "directAccessGrantsEnabled": true,
            "redirectUris": ["http://localhost:5174/*", "http://localhost:3179/*"],
            "webOrigins": ["+"],
            "attributes": {
              "pkce.code.challenge.method": "S256",
              "post.logout.redirect.uris": "http://localhost:5174/*##http://localhost:3179/*"
            }
          }
        ],
        "users": [
          {
            "username": "viewer",
            "enabled": true,
            "firstName": "Vera",
            "lastName": "Viewer",
            "email": "viewer@example.com",
            "emailVerified": true,
            "credentials": [{ "type": "password", "value": "viewer", "temporary": false }],
            "realmRoles": ["feature-planner-viewer"]
          },
          {
            "username": "editor",
            "enabled": true,
            "firstName": "Ed",
            "lastName": "Editor",
            "email": "editor@example.com",
            "emailVerified": true,
            "credentials": [{ "type": "password", "value": "editor", "temporary": false }],
            "realmRoles": ["feature-planner-editor:demo"]
          },
          {
            "username": "admin",
            "enabled": true,
            "firstName": "Ada",
            "lastName": "Admin",
            "email": "admin@example.com",
            "emailVerified": true,
            "credentials": [{ "type": "password", "value": "admin", "temporary": false }],
            "realmRoles": ["feature-planner-admin"]
          }
        ]
      }
